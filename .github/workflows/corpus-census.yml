name: Corpus census

on:
  pull_request:
    paths:
      - 'data/md/**'
      - 'scripts/corpus_census.py'
      - 'editorial/CENSUS.yaml'
      - '.github/workflows/corpus-census.yml'

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Generate census
        run: |
          python scripts/corpus_census.py --summary
          python scripts/corpus_census.py --write editorial/CENSUS.generated.yaml
          echo '--- BEGIN GENERATED CENSUS ---'
          cat editorial/CENSUS.generated.yaml
          echo '--- END GENERATED CENSUS ---'

      - name: Bootstrap committed census snapshot
        if: ${{ hashFiles('editorial/CENSUS.yaml') == '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          cp editorial/CENSUS.generated.yaml editorial/CENSUS.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- editorial/CENSUS.yaml
          git commit -m 'Add generated corpus census snapshot'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Check committed census freshness
        if: ${{ hashFiles('editorial/CENSUS.yaml') != '' }}
        run: diff -u editorial/CENSUS.yaml editorial/CENSUS.generated.yaml

      - name: Upload generated census
        uses: actions/upload-artifact@v4
        with:
          name: corpus-census
          path: editorial/CENSUS.generated.yaml
