name: Corpus census

on:
  pull_request:
    paths:
      - 'data/md/**'
      - 'scripts/corpus_census.py'
      - 'editorial/CENSUS.yaml'
      - '.github/workflows/corpus-census.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Generate census
        run: |
          python scripts/corpus_census.py --summary
          python scripts/corpus_census.py --write editorial/CENSUS.generated.yaml

      - name: Check committed census freshness
        run: diff -u editorial/CENSUS.yaml editorial/CENSUS.generated.yaml

      - name: Upload generated census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-census
          path: editorial/CENSUS.generated.yaml
