name: Corpus census

on:
  pull_request:
    paths:
      - 'data/md/**'
      - 'scripts/corpus_census.py'
      - 'editorial/CENSUS.yaml'
      - '.github/workflows/corpus-census.yml'

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Generate census
        run: |
          python scripts/corpus_census.py --summary
          python scripts/corpus_census.py --write editorial/CENSUS.generated.yaml

      - name: Refresh committed census on same-repository PRs
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s editorial/CENSUS.yaml editorial/CENSUS.generated.yaml; then
            echo 'Committed census is current.'
            exit 0
          fi
          cp editorial/CENSUS.generated.yaml editorial/CENSUS.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- editorial/CENSUS.yaml
          git commit -m 'Refresh generated corpus census'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Require fresh census on fork PRs
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: diff -u editorial/CENSUS.yaml editorial/CENSUS.generated.yaml

      - name: Upload generated census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-census
          path: editorial/CENSUS.generated.yaml
