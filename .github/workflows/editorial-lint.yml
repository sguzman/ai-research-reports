name: Editorial lint

on:
  pull_request:
    paths:
      - 'data/md/**'
      - 'scripts/editorial_lint.py'
      - '.github/workflows/editorial-lint.yml'

permissions:
  contents: read

jobs:
  changed-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Validate changed article packages
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          git diff --name-only "$base_sha" "$head_sha" -- data/md \
            | awk -F/ '$1 == "data" && $2 == "md" && NF >= 4 {print $3}' \
            | sort -u > changed-slugs.txt

          if [[ ! -s changed-slugs.txt ]]; then
            echo "No canonical article packages changed."
            exit 0
          fi

          changelog_errors=0
          while IFS= read -r slug; do
            changelog="data/md/$slug/CHANGELOG.md"
            if [[ ! -f "$changelog" ]]; then
              echo "::error::$slug changed but has no CHANGELOG.md"
              changelog_errors=1
              continue
            fi
            if ! git diff --name-only "$base_sha" "$head_sha" -- "$changelog" | grep -Fxq "$changelog"; then
              echo "::error::$slug changed but its CHANGELOG.md was not updated in this PR"
              changelog_errors=1
            fi
          done < changed-slugs.txt

          if [[ "$changelog_errors" -ne 0 ]]; then
            exit 1
          fi

          while IFS= read -r slug; do
            echo "== $slug =="
            python scripts/editorial_lint.py --slug "$slug"
          done < changed-slugs.txt
