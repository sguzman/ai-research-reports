  notes: >-
    The 2026-08-21 final audit replaced the inherited claim that internet meme culture naturally maps onto a
    right-coded borderer style with a falsifiable style-vector hypothesis. Evidence from specific far-right
    corpora supports aggressive humor, anti-elitism, taboo, ironic ambiguity, and in-group signaling in some
    contexts, while research on r/DankLeft and Spanish political memes demonstrates that taboo-breaking,
    threatening out-groups, ridicule, and antagonism are not right-exclusive. Cross-national far-right research
    also shows that memes are unevenly important across organizations and countries. Political-effects claims
    were narrowed using experimental and longitudinal evidence rather than treating memes as inherently
    radicalizing or trust-destroying. The report explicitly rejects any inference of historical Borderer ancestry
    absent transmission evidence. Conversion-era citation residue, raw diagrams/timelines, unsupported illustrative
    typologies, and the unprovenanced converted image were removed. The companion methodological fork remains
    separate. No known source, conversion, asset, duplicate, or rendering blocker remains.
