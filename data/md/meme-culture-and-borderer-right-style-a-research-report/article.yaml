---
abstract: >-
  Tests the proposed “borderer-right” meme-style hypothesis against political-meme research. The report
  treats low deference, antagonistic humor, taboo-breaking, anti-elitism, ironic distance, status inversion,
  performative aggression, and in-group signaling as potentially measurable style dimensions rather than
  defining them as inherently right-wing, and evaluates cross-ideological, platform, and effects evidence.
