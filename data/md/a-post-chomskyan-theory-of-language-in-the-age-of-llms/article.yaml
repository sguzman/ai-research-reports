summary: >-
  A constructive post-Chomskyan research program that treats language acquisition as constrained learnability rather
  than a binary contest between innate grammar and statistics. The framework separates learnability, representation,
  performance, and grounding and requires competing learners to succeed or fail under explicit developmental conditions.
description: >-
  Language theory after LLMs should ask which learner and environmental constraints are actually necessary to reproduce
  the human language trajectory—and should allow experiments to strengthen innate-bias hypotheses as well as weaken them.
abstract: >-
  This report proposes a positive language-science program for the LLM era. Its basic object is a learner-input-target
  triple: a specified learner with explicit inductive biases, a developmentally characterized experience stream, and a
  target human generalization or trajectory. The framework separates four explanatory levels—learnability,
  representation, use/performance, and grounding/functional competence—so success at one is not inflated into a theory
  of all cognition. Architecture is treated as bias rather than as prior-free statistics; developmentally realistic
  quantity, distribution, ordering, modality, and interaction are treated as theoretical variables; and human-model
  convergence is evaluated through generalization, sample efficiency, learning curves, error profiles, impossible-
  language selectivity, causal representations, and cross-linguistic replication. The program is deliberately symmetric:
  robust success by relatively general learners weakens the need for rich language-specific priors, while repeated
  child-scale failures repaired by targeted structural priors strengthen them. The result preserves the generative
  question of how finite experience yields productive competence while replacing broad impossibility claims with
  adversarial computational comparison.
