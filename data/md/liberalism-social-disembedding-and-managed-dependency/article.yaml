abstract: This report explores the thesis that actually existing liberalism, especially when fused to
  advanced capitalism, tends to dissolve pre-liberal or nonmarket social bonds, reconstructing social
  coordination through commodified, bureaucratic, therapeutic, credentialed, and managerial mechanisms
  that create new dependencies.
