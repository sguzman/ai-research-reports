summary: >-
  Examines how modern liberal-capitalist societies shift dependency from inherited persons and communities
  toward markets, public administration, credentials, professions, and digital infrastructures, and asks
  when those systems expand practical freedom versus creating opaque or weakly contestable dependency.
description: >-
  A comparative political-economy account of dependency shifts under liberal modernity, including marketization,
  welfare re-embedding, state legibility, credentials, digital administration, social connection, and trust.
abstract: >-
  A source-audited analysis of how modern liberal-capitalist societies shift dependency among personal,
  market, administrative, credentialed, and digital institutions. Welfare decommodification and
  defamilialization are treated as counterexamples to a simple atomization theory, while institutional
  contestability is used to distinguish enabling mediation from domination.
