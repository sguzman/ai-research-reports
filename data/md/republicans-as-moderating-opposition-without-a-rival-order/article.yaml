abstract: A current-through-2026 policy-history analysis testing the claim that the Republican Party primarily moderates institutions created by Democrats rather than constructing durable alternatives. The revised comparison distinguishes retrenchment from replacement and identifies TANF, tax policy, USMCA, and immigration-enforcement capacity as important counterexamples to a universal moderating-opposition thesis.
