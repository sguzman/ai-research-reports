  notes: The 2026-08-21 audit substantially revised the inherited thesis rather than simply refreshing citations. TANF is treated as a durable Republican-led replacement of AFDC; the ACA remains the strongest example of opposition and retrenchment without comprehensive replacement; the 2017 tax structure and 2025 reconciliation law demonstrate durable affirmative Republican tax architecture; Gramm-Leach-Bliley and the First Step Act are classified as bipartisan directional changes; USMCA is treated as replacement within an inherited trade paradigm; and Public Law 119-21 demonstrates affirmative immigration-enforcement capacity building. The article now distinguishes retrenchment, reversal, replacement, and capacity building and explains variation through path dependence, policy feedback, veto points, coalition heterogeneity, and selective conservative state-building. Weak legacy sources and two conversion-heavy tables were removed in favor of direct CBO, CRS, USTR, Federal Reserve History, and Senate sources. Duplicate review found no competing canonical treatment. The package is ready for build-derived publication.
