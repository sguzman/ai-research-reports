---
abstract: >-
  An evidence review of feminizing gender-affirming hormone therapy (GAHT), separating established adult
  physical effects from less certain long-term outcomes and treating puberty suppression and adolescent
  hormone treatment as distinct evidence questions. The review covers breast and body-composition changes,
  fertility, cardiovascular and thromboembolic risk, bone health, mental health, youth evidence, and the
  divergence between professional guidelines and jurisdictional policy.
