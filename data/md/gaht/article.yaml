abstract: A structured overview of gender-affirming hormone therapy (GAHT) for people assigned male at
  birth (AMAB), focusing on physiologic effects, risk tradeoffs, and how outcomes differ by age of initiation,
  including discussion of puberty suppression with GnRH analogues. The inherited report covers body composition,
  breast development, skin and hair, fertility and sexual function, bone density, cardiovascular and
  thromboembolic risk, psychosocial outcomes, monitoring, and evidence gaps.
