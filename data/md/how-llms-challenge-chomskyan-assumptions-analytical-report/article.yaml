summary: >-
  A source-audited assessment of what neural language models actually establish about Chomskyan learnability claims.
  Specific computational results weaken some poverty-of-the-stimulus and impossible-language arguments, while child-scale
  data, model inductive bias, harder syntactic phenomena, and cognitive mismatch block a blanket `Chomsky refuted` verdict.
description: >-
  LLMs have not settled the innateness debate. They have turned many claims about what language can or cannot be learned
  from experience into experiments that can succeed, fail, and discriminate among competing theories.
abstract: >-
  This report separates five questions often collapsed in arguments about LLMs and Chomsky: whether a linguistic pattern
  is learnable at all, whether it is learnable from developmentally realistic input, what inductive biases are required,
  whether a successful learner models human cognition, and whether linguistic competence implies broader thought or
  grounding. Wilcox, Futrell, and Levy's neural acquisition of filler-gap dependencies and island sensitivity weakens a
  poverty-of-the-stimulus argument for that particular structure. Lan, Chemla, and Katzir's 2026 extension to parasitic
  gaps and across-the-board movement finds important failures under realistic input and tentative evidence in the other
  direction. Kallini et al.'s impossible-language experiments challenge categorical claims of neural indifference to
  possible versus impossible systems, while Hunter's 2025 critique limits the strongest inference. BabyLM motivates
  developmentally constrained data regimes, Katzir clarifies the difference between engineering success and a theory of
  human linguistic cognition, and Mahowald et al. separate formal linguistic competence from broader functional language
  use. The resulting position treats LLMs as adversarial learnability experiments rather than decisive replacements for
  linguistic theory.
