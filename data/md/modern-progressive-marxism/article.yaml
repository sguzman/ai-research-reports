abstract: This report argues that modern progressive politics is a mediated descendant of Marxist and
  Marx-adjacent socialist traditions. The connection is formalizable through genealogical inheritance
  and selective adaptation, evidenced by institutional continuities in labor organizations, welfare-state
  policies, and rhetorical frameworks surrounding class power, redistribution, and anti-monopoly politics.
