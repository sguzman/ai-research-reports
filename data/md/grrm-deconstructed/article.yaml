  notes: >-
    The 2026-08-22 final audit rejects the inherited claim that Martin builds dynamic human conflict on a mostly static
    natural backdrop and that Tolkien supplies a comparatively complete ecological model. The rewrite distinguishes
    causal integration from encyclopedic detail and removes soil-pH, exact-yield, irrigation, and similar checklist
    demands as invalid standalone realism tests. Martin's own archived winter correspondence establishes that northern
    material consequences include preservation, granaries, fishing, glass gardens, false springs, maester advice,
    migration, famine, and starvation. The remaining criticism is restricted to incomplete system closure: recurring
    multi-year seasons would plausibly produce more visible demographic, fuel, livestock, storage, trade, and resilience
    institutions. Tolkien is treated not as an agronomic simulator but as a writer whose landscape repeatedly acts in
    moral and historical causality. The inherited escaped citation lattice, raw comparison diagrams, weak fan/wiki
    source chains, unsupported quantitative worldbuilding requirements, and generic `Deconstructed` title were removed.
    No local assets are required. The package folder `grrm-deconstructed` is the canonical slug; the inherited
    `george-r-r-martin-deconstructed` public path is retained as an alias.
