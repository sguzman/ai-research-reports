summary: >-
  Compares material realism in Westeros and Middle-earth using causal integration rather than encyclopedic detail.
  Martin foregrounds scarcity, logistics, rule, and war while leaving some civilization-wide consequences of multi-year
  seasons abstract; Tolkien foregrounds landscape, memory, stewardship, and ecological damage without offering a
  quantitative agronomic simulation.
description: >-
  Martin and Tolkien do not differ simply as realist versus mythmaker. They make different parts of material reality
  causally active: scarcity and rule in Westeros, landscape and stewardship in Middle-earth.
abstract: >-
  This report replaces a checklist-based comparison of George R. R. Martin and J. R. R. Tolkien with a causal model of
  material worldbuilding. Realism is evaluated through descriptive texture, causal integration, institutional response,
  system closure, and symbolic load rather than through the presence of soil chemistry, crop yields, or other technical
  inventories. A Song of Ice and Fire is shown to model food, storage, famine, war damage, travel, geography, and
  political scarcity more deeply than the inherited critique admitted; Martin's own comments on northern winters
  explicitly invoke granaries, preserved food, fishing, glass gardens, false springs, migration, and starvation. The
  remaining weakness is narrower: civilizations exposed for centuries to unpredictable multi-year seasons would likely
  develop more visible demographic, energy, livestock, storage, and resilience institutions than the novels model.
  Tolkien is likewise recast: Middle-earth is not a more complete agricultural simulation, but landscape repeatedly
  functions as a historical and moral actor through Fangorn, Isengard, Mordor, the Shire, destruction, and restoration.
  The comparison concludes that Martin foregrounds material constraint where it intersects with conflict and rule,
  whereas Tolkien foregrounds material place where it intersects with memory, corruption, stewardship, and belonging.
