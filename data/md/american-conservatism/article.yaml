  notes: >-
    The 2026-08-22 final audit replaced the inherited claim that American conservatism is partly incoherent simply
    because the United States had a liberal-revolutionary founding. The rewritten report adds colonial
    constitutional historiography showing that resistance initially defended customary colonial constitutions and
    inherited English liberties, then tracks the universalizing move toward natural rights. Burke's support for
    conciliation with America is used as a direct counterexample to treating support for the American cause as
    incompatible with conservative political reasoning. The report separates four founding layers: inherited
    constitutionalism, revolutionary natural rights, republican constitution-making, and unequal religious/social
    order. It incorporates multiple-traditions and ascriptive-hierarchy scholarship, distinguishes federal
    non-establishment from state religious arrangements, and qualifies suffrage claims for state variation. Modern
    conservative constitutionalism is treated as historically constructed rather than projected backward unchanged;
    postwar constitutional discourse, later originalism, natural-law conservatism, fusionism, national conservatism,
    and post-liberalism are separated. The legacy converted diagram and duplicate reference export were removed, and
