---
abstract: >-
  A source-audited account of the tension inside American conservatism that replaces the simple claim that a
  revolutionary founding cannot support conservative politics. The founding combined inherited Anglo-American
  constitutional claims, universalizing natural-rights arguments, republican constitution-making, and unequal
  social institutions. American conservatism is therefore coherent only after it identifies which layer of that
  inheritance it seeks to conserve and how conflicts among them are ranked.
