  name: 'Testing a “Borderer” Meme-Style Hypothesis: A Research Framework'
  notes: >-
    The 2026-08-21 final audit replaced the inherited two-category rubric because it circularly defined
    right-coded memes as aggressive/callous and left-coded memes as empathetic/vulnerable, then proposed to
    test the same distinction. The revised framework separates source ideology from style, adds cross-ideological
    evidence that taboo-breaking and threatening out-groups also occur on the left, and treats platform, topic,
    format, source identifiability, and engagement as contextual variables rather than ideological proxies.
    The new codebook uses neutral dimensions for target orientation, hostility, humor, taboo, irony, anti-elitism,
    status inversion, performative aggression, in-group signaling, self-disclosure, care/solidarity, and aesthetic
    register. The design includes balanced multi-platform sampling, negative controls, template-family leakage
    protection, coder training, per-variable reliability, latent-factor testing, multivariable controls, held-out
    platform/community/time validation, and explicit rules for splitting or rejecting the borderer construct.
    Political effects are reserved for separate experimental or longitudinal designs. Raw Mermaid, hypothetical
    result claims, conversion-reference residue, and three unprovenanced illustrative converted images were removed.
    The broad cultural-analysis companion remains a separate related fork. No known source, conversion, asset,
    duplicate, or rendering blocker remains.
