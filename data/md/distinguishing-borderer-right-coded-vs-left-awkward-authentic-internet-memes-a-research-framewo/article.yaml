---
abstract: >-
  A non-circular research framework for testing whether a proposed “borderer” meme style is associated with
  political ideology. It assigns ideology independently from style, codes neutral dimensions such as hostility,
  taboo-breaking, irony, anti-elitism, status inversion, in-group signaling, vulnerability, care, and aesthetic
  register, and requires cross-platform validation and explicit falsification criteria.
