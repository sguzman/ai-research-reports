description: >-
  The Riemann zeros look uncannily spectral, but no accepted hidden instrument has been found. A nontechnical history
  of why Hilbert–Pólya remains compelling, what the strongest analogies really establish, and where metaphor stops.
abstract: >-
  The Hilbert–Pólya idea proposes that the Riemann Hypothesis might follow from a natural spectral structure whose
  self-adjointness or positivity forces the zeta zeros onto the critical line. This essay preserves the traditional
  musical metaphor while auditing its historical and mathematical limits. The Pólya attribution is traced to his
  1982 letter to Andrew Odlyzko recalling a 1910s conversation with Landau; the Hilbert attribution is treated as the
  more indirect Hellinger-to-Weil recollection. Selberg trace formulas and the function-field Riemann Hypothesis are
  presented as genuine nearby spectral/geometric precedents, Montgomery–Dyson and Odlyzko as powerful statistical
  evidence, and Berry–Keating and Connes as sophisticated but incomplete realizations. Candidate Hamiltonians are
  evaluated against explicit requirements for independent definition, exact spectral correspondence,
  self-adjointness/positivity, explanatory trace structure, and freedom from circular assumptions.
