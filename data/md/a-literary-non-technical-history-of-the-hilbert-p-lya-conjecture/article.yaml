  notes: >-
    The 2026-08-22 final audit reclassified the inherited neutral-looking report as a stylized literary-analytic essay.
    The music, vibration, wall, and unseen-instrument imagery are intentional framing devices; they are not evidence
    claims. The rewrite sharply qualifies the origins of the eponym: Pólya's account survives in a retrospective
    1982 letter, while Hilbert's survives indirectly through Hellinger and Weil, with no published joint conjecture
    or candidate operator from either mathematician. It distinguishes exact spectral realization from random-matrix
    statistics, finite numerical verification, asymptotic zero counting, and analogy. Selberg and function-field
    cases are retained as real mathematical precedents but not presented as literal solutions of the classical
    problem. Modern Berry–Keating, Connes, and Hamiltonian proposals are described at the level their results support,
    and a dedicated evidence ledger records what each development does and does not establish. No assets are required.
