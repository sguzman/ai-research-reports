abstract: >-
  Tests claims that American progressivism secularized Puritan moral psychology by separating direct
  transmission, later reception and reuse, morphological continuity, and mere analogy. The evidence supports
  a transformed Protestant reform lineage and later reinvention of Puritan national symbols, but not a single
  uninterrupted Puritan genealogy for Progressive-era or modern administrative politics.
