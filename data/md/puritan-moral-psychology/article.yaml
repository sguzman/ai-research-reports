abstract: This report analyzes the formal thesis that modern American progressivism inherited and secularized
  a durable moral-political grammar first institutionalized in New England Puritanism. The grammar includes
  covenantal mission, collective guilt, moralized authority, public scrutiny of conduct, and disciplinary
  institutions.
