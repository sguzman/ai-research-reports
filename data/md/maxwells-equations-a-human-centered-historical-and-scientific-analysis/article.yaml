summary: >-
  A source-audited history of how Faraday's experimental field concepts became Maxwell's dynamical electromagnetic
  theory, how Maxwell identified light with electromagnetic propagation, and how later Maxwellians and vector analysis
  produced the compact four-equation form now taught under Maxwell's name.
description: >-
  Maxwell's deepest achievement was not writing the exact four equations in today's textbooks. He made electricity,
  magnetism, and light parts of one dynamical field theory; later Maxwellians gave that theory much of its modern form.
abstract: >-
  This report reconstructs the development of Maxwellian electromagnetism without projecting the modern four-vector
  textbook equations backward into Maxwell's 1860s papers. Faraday's induction experiments and lines of force supplied
  both empirical constraints and a local physical picture. Maxwell's 1855–1856, 1861–1862, and 1865 work progressively
  mathematized that picture, developed electric displacement as part of a dynamical theory, and derived transverse
  electromagnetic propagation at a speed matching light. The resulting electromagnetic theory of light was Maxwell's
  major unification. The modern four-equation set is presented as a later canonical descendant: Maxwell's own theory
  used components, potentials, constitutive assumptions, and mechanical models, while Heaviside, Hertz, FitzGerald,
  Lodge, Gibbs, and the wider Maxwellian/vector-analysis tradition recast and stabilized the field-centered formalism.
  Hertz's experiments are separated from later wireless engineering, Einstein's 1905 special relativity is connected
  to the moving-body problems of Maxwellian electrodynamics rather than reduced to a single light-speed motivation,
  and classical Maxwell theory is distinguished from later quantum electrodynamics. Two generic converted field/wave
  diagrams are removed because they carry no unique historical evidence or provenance.
