---
abstract: >-
  Evaluates when aging democratic institutions generate genuine intergenerational extraction rather than
  ordinary life-cycle redistribution. The report distinguishes cohort lifetime incidence from cross-sectional
  age wealth, pension transfers, and gross public debt, and identifies turnout asymmetry, pension design,
  persistent deficits, and incumbent-protecting housing politics as conditional burden-shifting mechanisms.
