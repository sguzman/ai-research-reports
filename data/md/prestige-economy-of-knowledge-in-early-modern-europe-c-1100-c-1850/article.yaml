summary: >-
  A source-audited history of how European institutions converted different forms of knowledge into office,
  jurisdiction, property, patronage, clients, corporate recognition, and technical-state careers from c.1100 to
  c.1850. Rejects a simple law-to-mathematics succession in favor of multiple, overlapping prestige exchange rates.
description: >-
  Law did not hand its prestige to mathematics. Universities, venal offices, courts, markets, academies, and technical
  schools created different exchange rates between knowing something and being able to turn that knowledge into power.
abstract: >-
  This report reconstructs the social value of learned expertise in Europe from the rise of Bologna's law schools to
  the early nineteenth-century technical state. Prestige is treated not as a fixed property of disciplines but as an
  institutional exchange rate: the capacity to convert recognized knowledge into scarce goods such as office,
  jurisdiction, hereditary advantage, patronage, professional income, academy membership, or state technical service.
  Bologna demonstrates the unusually high convertibility of jurisprudence into governmental and ecclesiastical
  careers; ancien-régime French venal office shows that legal status depended on property, credit, and family strategy
  as well as learning; Padua provides direct counterevidence to a universal rise of mathematics because medicine
  remained institutionally dominant during Galileo's career. Court patronage, London's practical mathematicians, the
  Académie des Sciences, and École Polytechnique then illustrate distinct routes by which mathematical and scientific
  knowledge acquired new social returns. The result is a history of multiplying knowledge-status markets rather than
  a linear succession of disciplinary winners.
