  notes: >-
    The 2026-08-22 final audit retitled the artifact to correct the inherited chronological error: c.1100-c.1850 is
    not an `early modern` period. The rewrite preserves `prestige economy` only as a bounded analytical model and
    replaces the inherited law-then-mathematics succession with multiple institutional exchange rates. Bologna's legal
    regime is retained as a strong case of jurisprudence converting into corporate privilege and government service,
    but Paris and other university structures prevent generalizing Bologna into a universal medieval hierarchy.
    French robe-nobility is reframed around venal office, office-property, public credit, and family strategy rather
    than legal mastery automatically producing nobility. Padua's medicine-over-mathematics faculty hierarchy provides
    a direct negative case against a simple Scientific Revolution status takeover. Court patronage, practical
    mathematics, the Académie des Sciences, and École Polytechnique are treated as distinct new conversion channels.
    The Bernoulli family anecdote, raw diagrams, escaped conversion citations, and duplicated reference export were
    removed because they did not carry the argument to the same evidentiary standard. No local assets are required.
