---
abstract: 'A critical examination of Deleuze''s anti-system rhetoric and its limits. The report argues
  that decomposing social reality into multiplicities or constructions does not make underlying systems
  unreal or politically dispensable, and that theorists who denounce order often rely on its benefits
  while offering few workable alternatives. It outlines major Deleuzian concepts (difference and repetition,
  multiplicity, rhizome, assemblage, deterritorialization, the Body without Organs, and desiring-machines),
  then measures the critique against Deleuze''s texts and against more sympathetic interpretations.…'
