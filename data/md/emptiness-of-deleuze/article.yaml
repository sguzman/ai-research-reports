summary: >-
  Tests a polemical critique of Deleuze and finds that the strongest inherited charges misstate his ontology,
  while a narrower criticism survives: Deleuzian concepts explain genesis, transformation, and capture more
  readily than they supply normative criteria or institutional designs for legitimate durable political order.
description: >-
  A source-audited critical assessment of Deleuze on difference, multiplicity, assemblages, deterritorialization,
  the Body without Organs, political transformation, institutional normativity, and the limits of concept portability.
abstract: >-
  This report reconstructs and tests the claim that Deleuze's philosophy is politically or conceptually empty.
  It rejects the inherited conflation of Deleuze with generic social-construction rhetoric, shows that assemblages
  can be emergent organized unities and that deterritorialization is paired with reterritorialization, and removes
  lifestyle-based hypocrisy arguments. The strongest remaining criticism concerns scope: Deleuze and Guattari offer
  powerful accounts of individuation, micropolitics, capture, and transformation but comparatively little conventional
  normative theory of legitimate coercion, rights, institutional maintenance, or choice among durable rival orders.
