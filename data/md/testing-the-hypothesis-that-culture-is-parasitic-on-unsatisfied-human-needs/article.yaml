---
abstract: >-
  An evidence-tiered test of the hypothesis that culture feeds on unmet human needs. The report separates
  compensatory use, symbolic substitution, extractive monetization, and the stronger claim of reproductive
  dependence, finding direct evidence for bounded compensatory mechanisms and affective reinforcement but
  not for a universal theory in which culture requires persistent dissatisfaction.
