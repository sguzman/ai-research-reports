---
abstract: A wide-ranging report that tests whether culture is parasitic on unmet human needs by distinguishing
  origin, function, and reproduction claims. It argues that many cultural forms do arise from loneliness,
  insecurity, grief, status discrepancy, and existential anxiety, and that many modern cultural industries
  monetize symbolic compensation without resolving the underlying deficits; but it rejects the stronger
  claim that all culture depends on dissatisfaction for its existence.
