---
# Canonical metadata standard for every `data/md/<project>/article.yaml`.
# This is a strict superset of:
# - prior top-level metadata helper files under `data/md/`
# - the strongest existing project-level `article.yaml` records
# - legacy compatibility keys already present in the repo
#
# Completeness rule:
# - Every compatibility key below may remain present.
# - Do not invent substantive values merely to fill blanks.
# - `report` is the controlled extension area for report-specific metadata.
# - `type`, `editorial_profile`, and `voice` describe different dimensions.
# - document relationships are independent of lifecycle state.

# Identity and display
title: ""
subtitle: ""
linkTitle: ""
description: ""
summary: ""
abstract: ""
slug: ""
url: ""
aliases: []

# Dates and publication state
date: ""
publishDate: ""
lastmod: ""
expiryDate: ""
draft: false
status: ""
edition: ""
revision: ""

# People and ownership
author: []
authors: []
creator: []
publisher: ""
rights: ""
license: ""
lang: ""
language: ""

# Classification and discovery
identifier: ""
dataset_id: ""
plate_id: ""
# Form, e.g. report, research-brief, note, essay, guide, fiction, dialogue, reference.
type: ""
# Prose rules: academic, technical, argumentative, stylized, personal, creative.
# Leave unresolved on legacy material until editorially reviewed; do not bulk-infer.
editorial_profile: ""
# Intentional voice, e.g. neutral, instructional, polemical, nietzschean, literary. Blank is valid.
voice: ""
format: ""
reference-section-title: ""
categories: []
tags: []
keywords: []
subject: []
subjects: []
library_of_congress_classification:
  class: ""
  label: ""
  description: ""

# Inter-document relationships.
# Values are canonical slugs. Leave unresolved/empty rather than inventing links.
relationships:
  exact_duplicates: []
  near_duplicates: []
  derived_from: []
  derivatives: []
  merged_from: []
  merged_into: ""
  related: []

# Operator-controlled editorial decisions.
# This is not publication lifecycle state. It records why overlapping documents remain
# separate, are archived, or feed a synthesis target.
editorial:
  duplicate_review:
    status: ""       # pending | reviewed | not-applicable
    relationship: "" # exact-duplicate | near-duplicate | derivative | fork | merge-cluster | none
    disposition: ""  # archive-duplicate | keep-separate | merge-into-canonical | synthesize-new | none
    canonical_slug: ""
    rationale: ""

# Report-specific compatibility/extension block.
# Meaningful only when the artifact is actually a report or report-like technical work.
report:
  id: ""
  name: ""
  number: ""
  code: ""
  organization: ""
  series: ""
  collection: ""
  version: ""
  year: ""
  is_report: false
  kind: ""
  type: ""
  domain: ""
  discipline: ""
  subdiscipline: ""
  subject: ""
  topic: ""
  focus: ""
  emphasis: ""
  intent: ""
  stance: ""
  audience: ""
  level: ""
  region: ""
  region_focus: ""
  population_focus: ""
  period: ""
  period_covered: ""
  scope: ""
  scope_years: ""
  time_scope: ""
  time_span: ""
  method: ""
  methods: []
  structure: ""
  primary_texts: []
  notes: ""
  conversion:
    source_docx: ""
    tool: ""
    date: ""

# Legacy/report-series compatibility keys. Keep when already present.
report-no: ""
report-number: ""
report-year: ""
report_no: ""
report_number: ""
report_year: ""
series: ""
series-number: ""
series-title: ""
series_number: ""
series_title: ""

# Hugo/build compatibility keys retained where useful.
build:
  list: always
  publishResources: true
  render: always
cascade: {}
cover-image: ""
cover_image: ""
epub-chapter-level: 0
epub-cover-image: ""
epub-stylesheet: epub.css
epub-title-page: false
epub_cover_image: ""
headless: false
highlight-style: tango
isCJKLanguage: false
layout: ""
markup: ""
number-sections: false
outputs: []
resources: []
sitemap:
  changefreq: ""
  filename: sitemap.xml
  priority: 0
toc: false
toc-depth: 0
toc-title: ""
translationKey: ""
weight: 0
...
