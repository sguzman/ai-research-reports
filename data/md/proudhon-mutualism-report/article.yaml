summary: >-
  A source-audited study of Proudhon’s evolving mutualism, from the 1840 critique of absolute property
  through reciprocal exchange, the 1849 People’s Bank, mature federalism, the later rehabilitation of
  dispersed property as counter-power, and the divergent French and American mutualist legacies.
description: >-
  Examines Proudhon’s property theory, reciprocity, mutual credit, federation, the Banque du Peuple,
  later mutualist reception, economic criticisms, and the patriarchal limits of his anti-domination politics.
abstract: >-
  This report treats Proudhonian mutualism as an evolving theory of countervailing social power rather than
  a fixed labor-note blueprint. It distinguishes Proudhon’s own property, credit, association, and federalist
  arguments from later Warren-Greene-Tucker mutualism; evaluates the short-lived Banque du Peuple without
  treating it as proof of mutual-credit viability; and incorporates the later antinomy of property as both
  exploitation and possible protection against state centralization.
