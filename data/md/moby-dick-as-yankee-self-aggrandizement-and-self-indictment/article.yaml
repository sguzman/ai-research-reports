---
abstract: >-
  A source-audited literary and historical reading of Moby-Dick that preserves the insight that Melville both
  performs and indicts forms of Yankee and American self-aggrandizement while rejecting a totalizing folkway
  explanation. The analysis centers on New England whaling, sermonic authority, the imperial rhetoric of
  "The Advocate," the American "brains" and international "muscles" hierarchy, the cosmopolitan crew,
  Ishmael's unfinished cetology, Ahab's interpretive sovereignty, and the explicit property-and-conquest logic
  of "Fast-Fish and Loose-Fish."
