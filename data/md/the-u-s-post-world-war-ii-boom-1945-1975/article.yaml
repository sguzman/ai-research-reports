  notes: >-
    The 2026-08-21 final audit replaced the inherited conversion-heavy report and its cross-wired numbered
    citation lattice with named official and scholarly sources. It retained 1945–1975 as a broad institutional
    frame but identified 1948–1973 as the cleaner macroeconomic high-growth core. BEA output and BLS productivity
    evidence now anchor the boom; homeownership and college-enrollment growth are retained as measured outcomes
    without using them as automatic proof for any one policy. GI Bill claims were narrowed using Bound-Turner
    and Fetter: educational effects are moderate and geographically/racially unequal, while veterans' mortgage
    benefits explain only part of the aggregate homeownership surge. The housing account now distinguishes
    income gains, mortgage-term reform, FHA exclusion, and HOLC-map effects rather than collapsing them into one
    redlining/GI-Bill story. Goldin-Margo and Farber et al. separate wartime wage compression from postwar union
    distribution effects. Bretton Woods, the Marshall Plan, and the Interstate system are treated as operating
    institutions rather than quantified single-cause growth engines. The ending is reframed as a 1965–1975
    erosion and break involving inflation, Bretton Woods pressure, the 1973–74 oil shock, recession, and the
    sharp post-1973 productivity slowdown. Raw Mermaid/xychart source, conversion references, weak tertiary
    sourcing, and causal overreach were removed. Duplicate review found no competing canonical package. No
    known source, conversion, asset, or duplicate blocker remains.
