---
abstract: >-
  A source-audited account of the U.S. postwar high-growth regime that separates measured outcomes from
  competing causal explanations. The report treats 1948–1973 as the macroeconomic core inside a broader
  1945–1975 institutional frame, distinguishes productivity, distribution, housing, education, infrastructure,
  and international monetary mechanisms, and explains the 1970s break without reducing it to a single shock.
