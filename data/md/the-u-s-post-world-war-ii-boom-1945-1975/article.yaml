subtitle: Productivity, Institutions, Distribution, and the 1970s Break
summary: >-
  The postwar boom was a real and unusually broad high-growth regime, but not the product of one policy or one
  geopolitical accident. Its strongest explanation is an alignment of rapid productivity growth, rising incomes,
  transformed household finance, education, bargaining institutions, infrastructure, and international conditions
  that began to come apart before and during the 1970s.
