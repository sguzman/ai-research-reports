---
abstract: A comparative analytical report that formalizes the elite xenophilia hypothesis as a set of
  nested claims about immigration, demographic statecraft, and the long-run political maturation of outsider
  populations. It distinguishes spiteful, instrumental, structural, and status-cosmopolitan variants of
  the thesis, compares major cases across the United States, Germany, Argentina, Jordan, Sri Lanka, and
  Cote d'Ivoire, and argues that durable settlement usually transforms grievance politics rather than
  abolishing it.
