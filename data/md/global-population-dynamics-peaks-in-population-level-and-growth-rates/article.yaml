description: >-
  A source-audited demographic analysis of global population level, growth-rate peaks, demographic transition,
  country peak timing, population momentum, and uncertainty in long-range UN projections.
abstract: >-
  The global population growth rate peaked at about 2.3 per cent per year in 1963, while world population size
  continues to rise. World Population Prospects 2024 places the central population-level peak at about 10.3 billion
  in the mid-2080s and assigns an approximately 80 per cent probability to a peak within the twenty-first century.
  The report distinguishes observed history from projection, replaces unreproducible regional pseudo-precision with
  directly published UN peak-timing groups, and documents the January 2026 Togo-only interim update that left global
  and regional aggregates unchanged and postponed the next full WPP revision until July 2027.
