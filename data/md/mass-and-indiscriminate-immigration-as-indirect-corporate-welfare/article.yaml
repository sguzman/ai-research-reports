---
abstract: A political-economy report on the claim that mass and indiscriminate immigration can operate
  as indirect corporate welfare under specific institutional conditions. It synthesizes research on labor-supply
  effects, tied-status dependency, anti-union dynamics, delayed automation, and public-cost externalization,
  and argues that the thesis is strongest in segmented labor markets and employer-dependent migration
  regimes rather than as a universal claim about immigration.
