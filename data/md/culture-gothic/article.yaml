summary: >-
  An intentionally severe essay proposing “liberal gothic” as a bounded label for cultural forms organized around
  haunted interiority, therapeutic recognition, damaged intimacy, and moralized injury, while testing—and sharply
  limiting—the stronger claim that contemporary culture deliberately preserves suffering for profit.
description: >-
  A stylized, source-bounded polemic on trauma narratives, emotional engagement incentives, the proposed “liberal
  gothic” mode, and the distinction between diagnostic, necrotic, and restorative representations of suffering.
abstract: >-
  This essay preserves a deliberately severe cultural critique while separating rhetoric from evidence. It argues
  that contemporary institutions can become highly capable of turning suffering into information, identity,
  representation, and engagement without requiring any coordinated intention to keep people wounded. Research on
  loneliness, social reinforcement, engagement ranking, cross-ideological negativity, trauma fiction, and fiction’s
  social-cognitive effects is used to bound the argument. “Liberal gothic” is retained as a proposed aesthetic mode,
  not an established scholarly genre or a claim that negativity is uniquely liberal.
