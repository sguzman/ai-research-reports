summary: >-
  A bounded diagnostic taxonomy of “liberal gothic” as a proposed mode in which Gothic recurrence, wounded
  interpretation, and limited mastery converge, with explicit exclusion tests and cross-media boundary cases.
description: >-
  This report replaces a broad equation of introspective progressive media with “liberal gothic” by defining a narrower
  formal mode: unresolved pasts return, wounded protagonists gain partial interpretive knowledge, and recognition exceeds
  the power to repair compromised institutions or unsafe intimacy.
abstract: >-
  “Liberal gothic” is treated here as a proposed critical label rather than an established scholarly genre. The report
  requires three core structures—Gothic recurrence, wounded interpretation, and limited mastery—and treats compromised
  institutions, unsafe intimacy, and modern therapeutic/recognitional moral language as supporting criteria. Sadness,
  trauma, progressive politics, middle-class protagonists, slow plots, and prestige-indie aesthetics are explicitly
  insufficient on their own. OXENFREE II: Lost Signals and What Remains of Edith Finch are analyzed as strong members;
  Gone Home and Firewatch as boundary cases; and A Little Life and BoJack Horseman as adjacent or negative controls.
  The report also distinguishes a restrained form that preserves opacity and ambiguity from a degraded form in which
  injury becomes an automatic credential for depth or moral authority. The broader market/incentive argument remains in
  the separate published essay `culture-gothic`; the retired `liberal-gothic-quick-facts` package is not treated as a
  competing canonical article.
