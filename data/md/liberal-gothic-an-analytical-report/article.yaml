summary: >-
  A proposed field guide to “liberal gothic” as a contemporary morphology in which Gothic haunting is reorganized
  around the psychologically legible wound: intimate spaces become archives of injury, the past inhabits the present,
  and recognition, testimony, diagnosis, or mourning take over functions once performed by revelation or exorcism.
description: >-
  “Liberal gothic” is useful only if it means more than sad progressive characters in quiet places. This report tests
  a narrower morphology against trauma fiction, Gothic scholarship, the trauma plot, negative cases, and falsifiers.
abstract: >-
  This report rebuilds “liberal gothic” as a provisional and falsifiable cross-media morphology rather than an
  established genre or partisan category. Trauma and haunting already have a substantial scholarly history, so the
  proposed contribution is narrower: the explanatory wound becomes a privileged grammar of character legibility; the
  revenant past occupies ordinary domestic, institutional, or environmental spaces; confession, recognition, diagnosis,
  testimony, mourning, or refusal of cure often replace external exorcism; and subdued prestige aesthetics can make
  interior damage perform the work of Gothic architecture. The report distinguishes the mode from Parul Sehgal's broader
  trauma plot and rejects progressive politics, trauma alone, Gothic atmosphere alone, or introspection alone as
  sufficient criteria. *What Remains of Edith Finch* and *A Ghost Story* function as strong cases, *Firewatch* as a
  boundary case, and *A Little Life* as a wound-centered but spatially weaker case. A separable coding scheme and explicit
  falsifiers are provided so the proposed cluster can fail. The label “liberal” remains the most contestable part and is
  treated as a hypothesis about therapeutic moral legibility rather than an established ideological monopoly. One legacy
  conversion image remains physically present but is unreferenced and excluded from public resource publication; that
  unresolved asset prevents advancement beyond review.
