    rationale: >-
      The three Liberal Gothic packages are related functional forks rather than interchangeable duplicates.
      `culture-gothic` is the published stylized polemic **Aesthetics for the Maimed**, focused on the wound-market
      cultural indictment. `liberal-gothic-an-analytical-report` is the neutral morphology paper that defines and tests
      a proposed contemporary Gothic mode. `liberal-gothic-quick-facts` is the empirical briefing on negativity,
      reinforcement, engagement, and what evidence would be needed to establish a trauma premium. Keeping them separate
      prevents aesthetic classification, polemical interpretation, and causal market evidence from standing in for one another.
