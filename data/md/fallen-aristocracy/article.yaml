    elite, Byzantine migration, Meiji samurai, and post-imperial European-aristocratic cases in Oxford/Cambridge
    and specialist scholarship; drops Latin American independence as a clean test and retains it only as a
    boundary case; and replaces the universal 'fallen aristocrats drive history' formulation with a testable
