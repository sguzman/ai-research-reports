abstract: >-
  A comparative historical analysis of what happens to hereditary and status elites after revolution,
  conquest, or institutional reform. The report replaces a simple fallen-aristocrat restoration thesis with
  a more precise model of elite persistence through conversion of human, network, economic, and symbolic capital.
