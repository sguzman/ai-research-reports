  notes: The 2026-08-21 source audit substantially narrowed the inherited category. French noble émigrés, former samurai as a functional analogue, and post-First World War aristocratic intellectuals are treated as the strongest cases; Russian White émigrés, Byzantine scholars, and Latin American creoles are retained only as boundary or negative cases because they do not cleanly represent a displaced hereditary aristocracy. Weak inherited examples and deterministic psychology were replaced with a conditional model distinguishing subjective status threat from retained elite capacity and successor-state incorporation. Direct academic, institutional, and historical sources replaced the earlier mixed citation architecture. Duplicate review found no competing canonical treatment. The package is ready for build-derived publication.
